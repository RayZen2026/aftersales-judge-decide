# ===== AST 规则表（应用层 = AST 消费方：先 fetch 后 provider）=====
ast_rules:
  store_tier:                              # 阶段 2 batch 消费
    fetch:                                  # 应用层自己 lark-cli 拉
      app_token: HGDzb2h7MaydFxsqlyAcCpALnB1
      table_id: tbllJ5aMajBhYRjIs
      source_url: https://bggc.feishu.cn/wiki/QtV8wiiSuikve7kOzaKcS4tEnXb?table=tbllJ5aMajBhYRjIs&view=vewQEBYm73
      sort:
        - field: 日期
          field_id: fldJngjYMN
          direction: desc
      limit: 1
      fetch_fields:
        - name: 门店分层规则
          field_id: fldfAqG3wB
    provider: store-tier-rules             # 拉取后用 store-tier-rules SKILL（apply_tier 算法）
    interface: import
    function: apply_tier                   # apply_tier(shop_id, rules, store_stats) → A/B/C/D/其他
    use_llm: false
    
  aftersales_judgment:                     # 阶段 3 per-item 消费（AGENT 2 prompt 注入）
    fetch:                                  # 应用层自己 lark-cli 拉
      app_token: HGDzb2h7MaydFxsqlyAcCpALnB1
      table_id: tblty9QJT2g7caeg
      source_url: https://bggc.feishu.cn/wiki/QtV8wiiSuikve7kOzaKcS4tEnXb?table=tblty9QJT2g7caeg&view=...
      filter:
        - field: 是否生效
          field_id: fldHsJr6kG
          op: eq
          value: 是
      sort:
        - field: 优先级
          field_id: flddnAK6BZ
          direction: desc
      fetch_fields:                         # 5 字段（任锐 09:26 + 09:58 拍板，副作用不在内）
        - name: 优先级
          field_id: flddnAK6BZ
        - name: 触发条件AST                    # ★ 任锐 09:58 拍板：LLM 用这个
          field_id: fld4IQbIrS
        - name: 调整动作类型
          field_id: fld5YOKao4
        - name: 比例系数
          field_id: fldfumk6A3
        - name: 责任方
          field_id: fldNDIS3K5
    provider: null                          # ★ 不调 SKILL（应用层直接拼 prompt 给 LLM）
    consume: llm_prompt_injection           # LLM 消费（AST 树 JSON 字符串直接嵌入）
    use_llm: reference_only

magic_numbers:
  stale_timeout_minutes: 5
  payment_threshold_yuan: 200
  batch_size: 30
  max_tokens: 30000
  temperature: 0.1
  retry_max: 3
  dedup_window_hours: 24
  manual_review_threshold: null

llm:
  shared_chain:
  - miaoda/glm-5.1
  - miaoda/qwen-3.7-plus
  - miaoda/doubao-seed-2.0-pro
  - miaoda/minimax-m3
  agent3_chain:
  - miaoda/doubao-seed-2.0-pro
  - miaoda/minimax-m3
  params:
    max_tokens: 30000
    temperature: 0.1
  retry:
    backoff_seconds:
    - 0.5
    - 1
    - 2
    honor_retry_after: true
cron:
  schedule: 0 10-23 * * *
  timezone: Asia/Shanghai
failure:
  retry:
  - llm_rate_limit
  - llm_5xx
  - bitable_temp_unavailable
  manual_review:
  - appeal_info_insufficient
  - rule_conflict
  - llm_ability_exceeded
  terminal:
  - credential_invalid
  - rule_not_found
  - data_corrupted
state_machine:
  states:
  - pending
  - processing
  - manual_review
  - completed
  - failed
  terminal:
  - completed
  - failed
notify:
  channels:
  - type: feishu_dm
    target: ou_8f870f9b1670d27d033d91fda17ade4e
  - type: memory_file
    path: memory/notify_<date>.md
  dedup:
    window_hours: 24
    key: upgrade_order_id
lock:
  scope: per_item
  stale_minutes: 5
  acquire_field: status
  acquire_value: processing
  release_states:
  - completed
  - failed
  - manual_review
preflight:
- name: feishu_creds
  check: env_present
  targets:
  - BITABLE_APP_TOKEN_BUSINESS
  - BITABLE_APP_TOKEN_FIELDS
  - BITABLE_APP_TOKEN_RULES
  fail_action: abort
- name: bitable_access
  check: lark_read
  targets:
  - task_table
  - result_table
  - product_dimension_table
  - store_table
  fail_action: abort
- name: llm_chain
  check: llm_ping
  target: miaoda/glm-5.1
  fail_action: warn_only
- name: cron_config
  check: cron_registered
  fail_action: warn_only
- name: disk_space
  check: disk_min_mb
  threshold_mb: 500
  fail_action: warn_only
