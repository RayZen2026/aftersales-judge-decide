# ===== AST 规则表（应用层 = AST 消费方：先 fetch 后 provider）=====
ast_rules:
  store_tier:                              # 阶段 2 batch 消费
    fetch:                                  # 应用层自己 lark-cli 拉
      app_token: ${BITABLE_APP_TOKEN_RULES}
      table_id: tbllJ5aMjBhYRjIs           # 2026-08-12 修复笔误（旧值 tbllJ5aMajBhYRjIs 实测 not_found）
      source_url: https://bggc.feishu.cn/wiki/QtV8wiiSuikve7kOzaKcS4tEnXb?table=tbllJ5aMjBhYRjIs&view=vewQEBYm73
      sort:
        - field: 日期
          field_id: fldJngjYMN
          direction: desc
      limit: 1
      fetch_fields:
        - name: 门店分层规则
          field_id: fldfAqG3wB
    provider: store-tier-rules             # 拉取后用 store-tier-rules SKILL（apply_tier 算法）
    interface: import
    function: apply_tier                   # apply_tier(shop_id, rules, store_stats) → A/B/C/D/其他
    use_llm: false
    
  aftersales_judgment:                     # 阶段 3 per-item 消费（AGENT 2 prompt 注入）
    fetch:                                  # 应用层自己 lark-cli 拉
      app_token: ${BITABLE_APP_TOKEN_RULES}
      table_id: tblty9QJT2g7caeg
      source_url: https://bggc.feishu.cn/wiki/QtV8wiiSuikve7kOzaKcS4tEnXb?table=tblty9QJT2g7caeg&view=...
      filter:
        - field: 是否生效
          field_id: fldHsJr6kG
          op: eq
          value: 是
      sort:
        - field: 优先级
          field_id: flddnAK6BZ
          direction: desc
      fetch_fields:                         # 5 字段（确认 09:26 + 09:58 拍板，副作用不在内）
        - name: 优先级
          field_id: flddnAK6BZ
        - name: 触发条件AST                    # ★ 确认 09:58 拍板：LLM 用这个
          field_id: fld4IQbIrS
        - name: 调整动作类型
          field_id: fld5YOKao4
        - name: 比例系数
          field_id: fldfumk6A3
        - name: 责任方
          field_id: fldNDIS3K5
    provider: null                          # ★ 不调 SKILL（应用层直接拼 prompt 给 LLM）
    consume: llm_prompt_injection           # LLM 消费（AST 树 JSON 字符串直接嵌入）
    use_llm: reference_only

magic_numbers:
  stale_timeout_minutes: 5
  payment_threshold_yuan: 200
  batch_size: 30
  max_tokens: 30000
  temperature: 0.1
  retry_max: 3
  dedup_window_hours: 24
  manual_review_threshold: null

llm:
  provider: ${LLM_PROVIDER:dashscope}     # dashscope=开发/测试，miaoda=生产；从env注入，默认dashscope
  use_production_chain: true              # true=生产降级链(shared_chain)，false=开发单模型(dev)；仅provider=miaoda时生效
  timeout_seconds: 120                    # MiaodaBackend subprocess 超时（生产 30k prompt + Qwen3.7 慢响应兜底）
  shared_chain:
  - miaoda/glm-5.1
  - miaoda/qwen-3.7-plus
  - miaoda/doubao-seed-2.0-pro
  - miaoda/minimax-m3
  agent3_chain:                          # 3 AGENT 暂停轨道保留（D-20260812-007 切 1 AGENT 后 single 走 shared_chain）
  - miaoda/doubao-seed-2.0-pro
  - miaoda/minimax-m3
  dev:                                  # 开发后端（本地 CLI-only 栈，CLAUDE.md §2）；生产走 MiaodaBackend
    provider: dashscope
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus-latest             # 本账号仅 latest 别名可用（dev_env_setup §9.2）
    api_key_env: DASHSCOPE_API_KEY
    max_tokens: 8192                    # qwen 输出封顶（不用生产 30000，Round 1 风险 R1 拍板）
    temperature: 0.1
    timeout_seconds: 60
  params:
    max_tokens: 30000
    temperature: 0.1
  retry:
    max: 3
    backoff_seconds:
    - 0.5
    - 1
    - 2
    honor_retry_after: true
cron:
  schedule: 0 10-23 * * *
  timezone: Asia/Shanghai
failure:
  retry:
  - llm_rate_limit
  - llm_5xx
  - bitable_temp_unavailable
  manual_review:
  - appeal_info_insufficient
  - rule_conflict
  - llm_ability_exceeded
  terminal:
  - credential_invalid
  - rule_not_found
  - data_corrupted
state_machine:
  states:
  - pending
  - processing
  - manual_review
  - completed
  - failed
  terminal:
  - completed
  - failed
notify:
  channels:
  - type: feishu_dm
    target: ou_8f870f9b1670d27d033d91fda17ade4e
  - type: memory_file
    path: memory/notify_<date>.md
  dedup:
    window_hours: 24
    key: upgrade_order_id
lock:
  scope: per_item
  stale_minutes: 5
  acquire_field: status
  acquire_value: processing
  release_states:
  - completed
  - failed
  - manual_review
  - pending  # 字段缺失回退场景（main.py:421）
preflight:
- name: feishu_creds
  check: env_present
  targets:
  - BITABLE_APP_TOKEN_BUSINESS
  - BITABLE_APP_TOKEN_FIELDS
  - BITABLE_APP_TOKEN_RULES
  fail_action: abort
- name: bitable_access
  check: lark_read
  targets:
  - task_table
  - result_table
  - product_dimension_table
  - store_table
  fail_action: abort
- name: llm_chain
  check: llm_ping
  target: miaoda/glm-5.1
  fail_action: warn_only
- name: cron_config
  check: cron_registered
  fail_action: warn_only
- name: disk_space
  check: disk_min_mb
  threshold_mb: 500
  fail_action: warn_only

# ===== 探针（Phase 1 开发模式，不进 SKILL.md body）=====
# 2026-08-12 拍板：Round 1 = 端到端跑通（格式/一致性/latency），准确率 Round 2
# LLM = DashScope qwen-plus-latest 单模型占位全链（本地无妙搭；生产 4+2 链见 llm 块）
probe:
  output_dir: probes                        # env PROBE_OUTPUT_DIR 优先
  evaluation_rubric: assets/eval/eval_standard.md
  test_scenarios: []                        # Round 2 填（场景化样本分组）
  llm:
    provider: dashscope
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus-latest                 # 本账号仅 latest 别名可用（dev_env_setup §9.2）
    api_key_env: DASHSCOPE_API_KEY
    max_tokens: 8192                        # 不用生产 30000（qwen 输出上限风险）；生产值在 llm.params，不动
    temperature: 0.1
    timeout_seconds: 60
    retry:
      max: 3
      backoff_seconds: [0.5, 1, 2]
  task_fetch:
    limit_default: 5
    limit_max: 200                          # 临时提升：用于GT测试覆盖全部样本（168条任务表数据）
    status_in:                             # 客户端过滤（视图拉取后）；filter-json 会覆盖视图过滤（2026-08-12 实测），不能与 view 同传
    - 未处理                                # 表中现行值（= 拍板 5 状态的"待处理"，阻塞项 #7 待统一）
    - 已处理-失败                            # cron 兜底重试（architecture.md §2 拉取矩阵：拉取 = 待处理 + 失败）
    field_names:                            # 任务表 25 读取字段（live 投影；≠ task_table.select_fields 23 写回字段）
    - 升级售后单号
    - 诉求类型
    - 诉求赔付金额
    - 商品实付金额
    - 升级售后类型
    - 已处理意见（客服组长处理意见）
    - 问题描述
    - 客户诉求
    - 问题类型
    - 是否商家问题
    - 是否平台问题
    - 是否物流问题
    - 是否代理人问题
    - 是否门店问题
    - 是否严重品质问题
    - 举证视频数量
    - 举证图片数量
    - 升级售后提交间隔天数
    - 订单日期
    - 商品id
    - 商品名称
    - 商品等级
    - 店铺ID
    - 是否全品类商家
    - 处理状态
  task_field_mapping:                       # 任务表字段 → 模板变量（渲染层映射，显式可审计）
    appeal_content_fields:                  # 拼接为 appeal_content（None 段跳过）
    - 问题描述
    - 客户诉求
    - 已处理意见（客服组长处理意见）
    appeal_type: 诉求类型
    appeal_amount: 诉求赔付金额
    aftersales_type: 升级售后类型
    aftersales_interval: 升级售后提交间隔天数
  store_tier:
    scripts_dir_default: submodules/store-tier-rules/scripts   # env STORE_TIER_RULES_DIR 覆盖（部署路径不同，见 README）
    degrade_on_failure: true                # 分层失败 → store_tier=null + join_meta 记 reason，不中断探针
  consistency_runs: 3
  csv_header_aliases: {}                    # CSV 表头名别名（飞书导出表头漂移时补）
